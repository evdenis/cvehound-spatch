# Publishes the wheels to PyPI with Trusted Publishing (OIDC).
#
# One-time PyPI-side setup: add a trusted publisher at
# https://pypi.org/manage/project/cvehound-spatch/settings/publishing/
# with owner=evdenis, repository=cvehound-spatch, workflow=release.yml,
# environment=pypi.
#
# Publishing a GitHub release is what ships a version; running this workflow by
# hand only rehearses the build.

name: release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # A release tag that disagrees with VERSION would publish a wheel whose
  # filename says one thing and whose tag says another. This runs on every
  # event -- not just releases -- because a job that is skipped makes GitHub
  # skip everything downstream of it, publish included.
  check-version:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - run: |
        if [[ "$GITHUB_EVENT_NAME" != release ]]; then
          echo "$GITHUB_EVENT_NAME: no tag to check"
          exit 0
        fi
        version=$(cat VERSION)
        tag="${GITHUB_REF_NAME#v}"
        [[ "$version" == "$tag" ]] || {
          echo "tag $GITHUB_REF_NAME does not match VERSION $version" >&2
          exit 1
        }

  build:
    needs: [check-version]
    uses: ./.github/workflows/build.yml

  publish:
    needs: [build]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        pattern: wheel-*
        merge-multiple: true
        path: dist

    - uses: astral-sh/setup-uv@v10.0.1

    - name: Publish
      run: uv publish dist/*.whl
